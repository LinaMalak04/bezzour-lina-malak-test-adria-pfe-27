spring.application.name=transaction-service
server.port=8082
# bank.transaction.max-amount comes from config-service : without it the service refuses to start
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:h2:mem:transaction-db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# 30 s by default : too long to notice that account-service is back
eureka.client.registry-fetch-interval-seconds=5

spring.graphql.graphiql.enabled=true

# OpenFeign : short timeouts, retries are handled by Resilience4J only
spring.cloud.openfeign.client.config.account-service.connect-timeout=1000
spring.cloud.openfeign.client.config.account-service.read-timeout=2000

# Resilience4J : business refusals (404, 422) are answers from a healthy service, not failures
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions=com.adria.bank.transaction.domain.AccountNotFoundException,com.adria.bank.transaction.domain.BusinessRuleException
resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=200ms
resilience4j.retry.instances.accountService.ignore-exceptions=com.adria.bank.transaction.domain.AccountNotFoundException,com.adria.bank.transaction.domain.BusinessRuleException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=3000

# PENDING transactions (account-service was unavailable) are replayed with the same operation id
bank.reconciliation.delay-ms=15000
bank.reconciliation.min-age-seconds=30

management.endpoints.web.exposure.include=health,info,metrics,refresh,circuitbreakers
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# MCP server (Streamable HTTP) on /mcp
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
