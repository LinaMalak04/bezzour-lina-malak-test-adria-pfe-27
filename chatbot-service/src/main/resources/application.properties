spring.application.name=chatbot-service
server.port=8087
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# LLM : any OpenAI compatible API, Groq by default
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:missing}
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.1
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# MCP client : the tools come from the servers of the two business services
spring.ai.mcp.client.name=chatbot-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.account-service.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=${TRANSACTION_MCP_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
