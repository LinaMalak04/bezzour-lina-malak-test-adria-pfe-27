spring.application.name=config-service
server.port=8888
# Native backend : CONFIG_REPO lets Docker mount config-repo/ so a value can change without rebuilding the image
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:classpath:/config-repo}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
