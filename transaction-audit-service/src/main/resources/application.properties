spring.application.name=transaction-audit-service
server.port=8083
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=transaction-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# A malformed message is logged and skipped instead of blocking the partition forever
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.adria.bank.audit.TransactionCreatedEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
